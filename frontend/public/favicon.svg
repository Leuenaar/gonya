  <circle cx="90" cy="370" r="16" fill="#FFE2B2" filter="url(#coreGlow)"/>
  <circle cx="250" cy="270" r="22" fill="#FFB347" filter="url(#coreGlow)" />
  <path d="M 250,270 L 250,150" fill="none" stroke="#4B657D" stroke-width="5" />
  <path d="M 250,270 L 160,310" fill="none" stroke="#4B657D" stroke-width="5" />
  <path d="M 250,270 L 340,310" fill="none" stroke="#4B657D" stroke-width="5" />
