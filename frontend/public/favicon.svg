      <stop offset="0%" stop-color="#FFE2B2" />
      <stop offset="100%" stop-color="#FFB347" />
    </linearGradient>
    <linearGradient id="tealDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A252F" />
      <stop offset="100%" stop-color="#4B657D" />
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
